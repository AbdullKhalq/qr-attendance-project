<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Attendance System{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<header class="site-header">
    <div>
        <strong>Automated Attendance</strong>
        <span class="muted">QR + blockchain MVP</span>
    </div>
    <nav>
        <a href="{{ url_for('lecturer.dashboard') }}">Lecturer</a>
        <a href="{{ url_for('student.register') }}">Student</a>
    </nav>
</header>
<main class="container">
    {% with messages = get_flashed_messages(with_categories=true) %}
        {% for category, message in messages %}
            <div class="alert {{ category }}">{{ message }}</div>
        {% endfor %}
    {% endwith %}
    {% block content %}{% endblock %}
</main>
</body>
</html>
