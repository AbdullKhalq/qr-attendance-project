{% extends "base.html" %}
{% block title %}Log in | Automated Attendance{% endblock %}
{% block content %}
<div class="card">
    <h1>Log in</h1>
    <form method="post">
        <label for="institutional_id">Student or staff ID</label>
        <input id="institutional_id" name="institutional_id" required autofocus>

        <label for="password">Password</label>
        <input id="password" name="password" type="password" required>

        <button type="submit">Log in</button>
    </form>
</div>
{% endblock %}
