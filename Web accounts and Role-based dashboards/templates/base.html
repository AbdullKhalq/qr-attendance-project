<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Automated Attendance{% endblock %}</title>
    <style>
        :root { font-family: Arial, sans-serif; color: #1f2937; background: #f3f4f6; }
        * { box-sizing: border-box; }
        body { margin: 0; }
        nav { background: #111827; color: white; padding: 1rem; display: flex; gap: 1rem; align-items: center; }
        nav a { color: white; text-decoration: none; }
        nav .spacer { flex: 1; }
        main { max-width: 820px; margin: 2rem auto; padding: 0 1rem; }
        .card { background: white; border-radius: 12px; padding: 1.25rem; margin-bottom: 1rem; box-shadow: 0 2px 8px rgba(0,0,0,.08); }
        label { display: block; font-weight: 600; margin-top: .8rem; }
        input, select { width: 100%; padding: .7rem; margin-top: .3rem; border: 1px solid #cbd5e1; border-radius: 8px; }
        button, .button { display: inline-block; margin-top: 1rem; padding: .7rem 1rem; border: 0; border-radius: 8px; background: #2563eb; color: white; text-decoration: none; cursor: pointer; }
        button.secondary { background: #4b5563; margin-top: 0; }
        .flash { padding: .8rem 1rem; border-radius: 8px; margin-bottom: .8rem; }
        .flash.success { background: #dcfce7; }
        .flash.error { background: #fee2e2; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: .7rem; border-bottom: 1px solid #e5e7eb; text-align: left; }
        .muted { color: #6b7280; }
    </style>
</head>
<body>
<nav>
    <a href="{{ url_for('home') }}"><strong>Attendance MVP</strong></a>
    <span class="spacer"></span>
    {% if session.get('user_id') %}
        <a href="{{ url_for('dashboard.dashboard') }}">Dashboard</a>
        <form method="post" action="{{ url_for('auth.logout') }}">
            <button class="secondary" type="submit">Log out</button>
        </form>
    {% else %}
        <a href="{{ url_for('auth.login') }}">Log in</a>
        <a href="{{ url_for('auth.register') }}">Register</a>
    {% endif %}
</nav>
<main>
    {% with messages = get_flashed_messages(with_categories=true) %}
        {% for category, message in messages %}
            <div class="flash {{ category }}">{{ message }}</div>
        {% endfor %}
    {% endwith %}
    {% block content %}{% endblock %}
</main>
</body>
</html>
